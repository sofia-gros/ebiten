# mise configuration for PSVita build environment in examples/psvita_build
[tools]
go = "1.26.5"
tinygo = "latest"

[env]
VITASDK = "{{config_root}}/.vitasdk"
_.path = ["{{config_root}}/.vitasdk/bin"]

[tasks.setup-vitasdk]
description = "Download and extract VitaSDK for Windows into .vitasdk directory"
run = [
    "powershell -Command \"if (!(Test-Path .vitasdk)) { New-Item -ItemType Directory -Path .vitasdk }\"",
    "echo Downloading VitaSDK for Windows...",
    "curl -L -o vitasdk.tar.bz2 https://github.com/vitasdk/autobuilds/releases/download/master-linux-v1136/vitasdk-x86_64-w64-mingw32-2024-04-18_17-48-26.tar.bz2",
    "tar -xjf vitasdk.tar.bz2 -C .vitasdk --strip-components=1",
    "powershell -Command \"if (Test-Path vitasdk.tar.bz2) { Remove-Item vitasdk.tar.bz2 }\"",
    "echo VitaSDK setup complete in {{config_root}}/.vitasdk"
]

[tasks.build-vita]
description = "Build PSVita VPK binary using TinyGo, w2c2, and VitaSDK"
run = [
    "powershell -Command \"if (!(Test-Path build/w2c2_out)) { New-Item -ItemType Directory -Path build/w2c2_out -Force }\"",
    "tinygo build -target=wasip1 -o build/game.wasm .",
    "w2c2 build/game.wasm build/w2c2_out/game_wasm.c",
    "arm-vita-eabi-gcc -O2 -I../../psvita/bridge -Ibuild/w2c2_out ../../psvita/bridge/vita_bridge.c build/w2c2_out/*.c -lSceTouch_stub -lSceMotion_stub -lScePower_stub -lSceCtrl_stub -o build/game.velf",
    "vita-make-fself build/game.velf build/eboot.bin",
    "vita-pack-vpk -s ../../psvita/param.sfo -b build/eboot.bin build/game.vpk",
    "echo Build Complete: build/game.vpk"
]

[tasks.run-pc]
description = "Run PSVita example on PC (Emulated)"
run = "go run ."
